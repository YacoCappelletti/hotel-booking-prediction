services:
  api:
    build: .
    image: hotel-booking-cancellation-prediction
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  predict-app:
    image: hotel-booking-cancellation-prediction
    command: streamlit run apps/predict_app/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    image: hotel-booking-cancellation-prediction
    command: streamlit run apps/dashboard/app.py --server.port 8502 --server.address 0.0.0.0
    ports:
      - "8502:8502"
    depends_on:
      api:
        condition: service_healthy
